name: Keisha - Periksa MP4 dan Siapkan Draf Sosmed
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Nomor run GitHub Actions Keisha - Studio MP4 yang berhasil"
        required: true
        type: string
      mode:
        description: "inspect = hanya periksa; create_drafts = unggah Cloudinary dan buat DRAF Buffer"
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - create_drafts
permissions:
  contents: read
  actions: read
concurrency:
  group: keisha-social-drafts-\${{ inputs.source_run_id }}
  cancel-in-progress: false
jobs:
  validate-and-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ambil kode Keisha yang aktif
        uses: actions/checkout@v4
      - name: Periksa nomor run dan mode
        shell: bash
        env:
          RUN_ID: \${{ inputs.source_run_id }}
          MODE: \${{ inputs.mode }}
        run: |
          if ! [[ "$RUN_ID" =~ ^[1-9][0-9]{4,15}$ ]]; then
            echo "::error::source_run_id harus angka dari halaman GitHub Actions Keisha."
            exit 1
          fi
          if [[ "$MODE" != "inspect" && "$MODE" != "create_drafts" ]]; then
            echo "::error::Mode tidak diizinkan."
            exit 1
          fi
      - name: Unduh MP4 dari run sukses pilihan
        uses: actions/download-artifact@v4
        with:
          name: Keisha-MP4-Studio
          run-id: \${{ inputs.source_run_id }}
          github-token: \${{ secrets.GITHUB_TOKEN }}
          path: incoming
      - name: Periksa ffprobe
        run: ffprobe -version | head -n 1
      - name: Instal Cloudinary bila memilih draf
        if: \${{ inputs.mode == 'create_drafts' }}
        run: python -m pip install "cloudinary>=1.40,<2"
      - name: Periksa MP4 dan jika dipilih buat draf Buffer (tidak memposting)
        env:
          MODE: \${{ inputs.mode }}
          RUN_ID: \${{ inputs.source_run_id }}
          BUFFER_API_KEY: \${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_CLOUD_NAME: \${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: \${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: \${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python Keisha_Video_Cloud_Starter_v1/social_drafts.py \
            --mode "$MODE" --run-id "$RUN_ID" \
            --video "incoming/keisha-rcd-video.mp4" \
            --metadata "incoming/metadata.json" \
            --output "social-drafts-result.json"
      - name: Arsipkan laporan hasil tanpa kredensial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keisha-Social-Drafts-Check
          path: social-drafts-result.json
          if-no-files-found: ignore
          retention-days: 14
