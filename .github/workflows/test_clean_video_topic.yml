name: Keisha - Tes Pembersihan Naskah
on:
  pull_request:
    paths:
      - 'Keisha_Video_Cloud_Starter_v1/render_studio.py'
      - 'Keisha_Video_Cloud_Starter_v1/tests/test_clean_video_topic.py'
      - '.github/workflows/test_clean_video_topic.yml'
permissions:
  contents: read
jobs:
  test-clean-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Test topic cleanup
        working-directory: Keisha_Video_Cloud_Starter_v1
        run: python -m unittest discover -s tests -p test_clean_video_topic.py -v
