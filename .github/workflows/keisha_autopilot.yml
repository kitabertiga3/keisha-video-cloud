name: Keisha - AI Office Autopilot Harian (AMAN)

on:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Asia/Jakarta'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = tes, preflight = koneksi, audit_drafts = cek Buffer/Cloudinary tanpa posting, plan/render/drafts/schedule'
        required: true
        default: check
        type: choice
        options:
          - check
          - preflight
          - audit_drafts
          - plan
          - render
          - drafts
          - schedule
      draft_audit_date:
        description: 'Tanggal video Cloudinary lama untuk audit (tanpa GitHub artifact)'
        required: false
        default: '2026-11-20'
        type: string
      source_plan_run_id:
        description: 'Untuk render/drafts: naskah sukses #11 (kosong = buat baru)'
        required: false
        default: '44637045432'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: keisha-autopilot-daily
  cancel-in-progress: false

jobs:
  daily-office:
    if: ${{ github.event_name != 'schedule' || vars.AUTOPILOT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUN_MODE: ${{ github.event_name == 'schedule' && 'schedule' || inputs.mode }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      TELEGRAM_KEISHA_TOKEN: ${{ secrets.TELEGRAM_KEISHA_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cek sintaks dan tes keamanan dulu
        run: |
          python -m py_compile autopilot/office_daily.py
          python -m unittest discover -s autopilot -p 'test_*.py' -v
      - name: Periksa channel Buffer tanpa mengirim posting (preflight)
        if: ${{ env.RUN_MODE == 'preflight' || env.RUN_MODE == 'drafts' }}
        run: python autopilot/office_daily.py preflight --result autopilot_result.json
      - name: Siapkan SDK Cloudinary untuk audit BACA SAJA
        if: ${{ env.RUN_MODE == 'audit_drafts' }}
        run: python -m pip install 'cloudinary>=1.40,<2'
      - name: Audit draf dari Buffer dan Cloudinary (tanpa artifact lama)
        if: ${{ env.RUN_MODE == 'audit_drafts' }}
        run: |
          python autopilot/office_daily.py audit_drafts \
            --audit-date "${{ inputs.draft_audit_date }}" \
            --result autopilot_result.json
      - name: Ambil naskah AI yang sudah sukses (khusus render)
        if: ${{ (env.RUN_MODE == 'render' || env.RUN_MODE == 'drafts') && inputs.source_plan_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: Keisha-Autopilot-Report
          run-id: ${{ inputs.source_plan_run_id }}
          github-token: ${{ github.token }}
          path: .
      - name: Validasi naskah tersimpan sebelum render
        if: ${{ (env.RUN_MODE == 'render' || env.RUN_MODE == 'drafts') && inputs.source_plan_run_id != '' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from autopilot.office_daily import normalize_saved_plan
          path = Path('autopilot_plan.json')
          plan = normalize_saved_plan(json.loads(path.read_text(encoding='utf-8')))
          if not plan.get('date') or not plan.get('theme'):
              raise ValueError('Artifact tidak punya tanggal atau tema naskah.')
          path.write_text(json.dumps(plan, ensure_ascii=False, indent=2), encoding='utf-8')
          print('Naskah lama dinormalisasi: URL pindah ke caption; video hanya menyebut bio.')
          PY
      - name: AI menyusun naskah dan strategi (mode plan/schedule/render baru)
        if: ${{ env.RUN_MODE == 'plan' || env.RUN_MODE == 'schedule' || ((env.RUN_MODE == 'render' || env.RUN_MODE == 'drafts') && inputs.source_plan_run_id == '') }}
        run: python autopilot/office_daily.py plan --plan autopilot_plan.json
      - name: Siapkan FFmpeg dan FFprobe untuk suara serta MP4
        if: ${{ env.RUN_MODE == 'render' || env.RUN_MODE == 'drafts' || env.RUN_MODE == 'schedule' }}
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
          python - <<'PY'
          import shutil
          assert shutil.which('ffmpeg'), 'FFmpeg tidak ditemukan pada GitHub runner.'
          assert shutil.which('ffprobe'), 'FFprobe tidak ditemukan pada GitHub runner.'
          PY
      - name: Siapkan suara dan musik gratis untuk Keisha
        if: ${{ env.RUN_MODE == 'render' || env.RUN_MODE == 'drafts' || env.RUN_MODE == 'schedule' }}
        run: |
          python -m pip install -r Keisha_Video_Cloud_Starter_v1/requirements.txt
          python -m pip install 'numpy>=1.24,<3' 'piper-tts>=1.2,<2' cloudinary
          python -m pip install --upgrade --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'pocket-tts==3.1.0'
      - name: Cache model suara
        if: ${{ env.RUN_MODE == 'render' || env.RUN_MODE == 'drafts' || env.RUN_MODE == 'schedule' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: pocket-id-6l-v35
      - name: Render MP4 menggunakan mesin Keisha yang sekarang
        if: ${{ env.RUN_MODE == 'render' || env.RUN_MODE == 'drafts' || env.RUN_MODE == 'schedule' }}
        env:
          VIDEO_VOICE: natural
          VIDEO_MUSIC: otomatis
          VIDEO_STYLE: otomatis
          VIDEO_MUSIC_VOLUME: '0.14'
        run: |
          export VIDEO_NASKAH="$(python -c 'import json; p=json.load(open("autopilot_plan.json")); print(json.dumps({k:p[k] for k in ("headings","bodies","cta")},ensure_ascii=False))')"
          cd Keisha_Video_Cloud_Starter_v1
          python render_studio.py
      - name: QC video MP4 dan audio (tidak mengunggah)
        if: ${{ env.RUN_MODE == 'render' || env.RUN_MODE == 'drafts' || env.RUN_MODE == 'schedule' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from Keisha_Video_Cloud_Starter_v1.social_drafts import validate_metadata, validate_video
          plan = json.loads(Path('autopilot_plan.json').read_text(encoding='utf-8'))
          metadata = validate_metadata(Path('Keisha_Video_Cloud_Starter_v1/hasil/metadata.json'))
          if metadata['headings'] != plan['headings'] or metadata['bodies'] != plan['bodies']:
              raise ValueError('Naskah MP4 tidak sama dengan naskah AI yang disetujui.')
          video = validate_video(Path('Keisha_Video_Cloud_Starter_v1/hasil/keisha-rcd-video.mp4'), metadata)
          print('MP4 tervalidasi (tanpa upload/jadwal):', video)
          PY
      - name: Simpan tiga DRAF Buffer (tidak mengaktifkan posting)
        if: ${{ env.RUN_MODE == 'drafts' }}
        run: |
          python autopilot/office_daily.py drafts \
            --plan autopilot_plan.json \
            --video Keisha_Video_Cloud_Starter_v1/hasil/keisha-rcd-video.mp4 \
            --metadata Keisha_Video_Cloud_Starter_v1/hasil/metadata.json \
            --result autopilot_result.json
      - name: Pastikan video valid lalu jadwalkan SATU ke tiap channel
        if: ${{ env.RUN_MODE == 'schedule' }}
        run: |
          python autopilot/office_daily.py schedule \
            --plan autopilot_plan.json \
            --video Keisha_Video_Cloud_Starter_v1/hasil/keisha-rcd-video.mp4 \
            --metadata Keisha_Video_Cloud_Starter_v1/hasil/metadata.json \
            --result autopilot_result.json
      - name: Laporkan kegagalan satu kali tanpa retry posting
        if: ${{ failure() && env.RUN_MODE == 'schedule' }}
        run: python autopilot/office_daily.py report_failure
      - name: Simpan laporan dan hasil produksi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keisha-Autopilot-Report
          path: |
            autopilot_plan.json
            autopilot_result.json
            Keisha_Video_Cloud_Starter_v1/hasil/keisha-rcd-video.mp4
            Keisha_Video_Cloud_Starter_v1/hasil/metadata.json
          if-no-files-found: ignore
          retention-days: 7