name: Keisha - Audit AI Office Autopilot
on:
  pull_request:
    paths:
      - 'autopilot/**'
      - '.github/workflows/keisha_autopilot.yml'
      - '.github/workflows/autopilot_checks.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax and no-network tests
        run: |
          python -m py_compile autopilot/office_daily.py autopilot/test_office_daily.py
          python -m unittest discover -s autopilot -p 'test_*.py' -v
      - name: Verify workflow YAML and safe default
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          data=yaml.safe_load(Path('.github/workflows/keisha_autopilot.yml').read_text())
          assert 'jobs' in data and 'daily-office' in data['jobs']
          guard=data['jobs']['daily-office']['if']
          assert 'AUTOPILOT_ENABLED' in guard
          assert 'true' in guard
          print('Valid workflow YAML with opt-in daily schedule')
          PY
