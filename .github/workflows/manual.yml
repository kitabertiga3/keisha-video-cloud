name: Keisha - Studio MP4 V3.5 Suara Tegas + Anti Spam

on:
  workflow_dispatch:
    inputs:
      naskah:
        description: 'Topik / naskah Fajar atau Nadia (wajib)'
        required: true
        type: string
      style:
        description: 'otomatis, majalah, neon, poster, kartu, minimal, diagonal'
        default: 'otomatis'
        required: false
        type: string
      voice:
        description: 'piper/tegas (stabil), natural (Pocket TTS gratis beta), mati'
        default: 'piper'
        required: false
        type: string
      music:
        description: 'otomatis, tenang, ceria, inspiratif, fokus, dramatis, mati'
        default: 'otomatis'
        required: false
        type: string
      visuals:
        description: 'Opsional: JSON storyboard Narska, disusun oleh Worker'
        required: false
        type: string
      cta:
        description: 'CTA opsional'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: keisha-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  buat-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Periksa mode suara (tanpa API key berbayar)
        env:
          VIDEO_VOICE: ${{ inputs.voice }}
        run: |
          echo "Mode suara diminta: ${VIDEO_VOICE}. Default gratis offline Piper."

      - name: Siapkan FFmpeg dan font jika belum tersedia
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! test -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          else
            echo 'FFmpeg dan font sudah tersedia; lewati instalasi ulang.'
          fi

      - name: Pillow + Piper + generator musik original
        run: |
          python -m pip install -r Keisha_Video_Cloud_Starter_v1/requirements.txt
          python -m pip install "piper-tts>=1.2,<2" "numpy>=1.24,<3"

      - name: Opsional Pocket TTS Indonesia (natural beta, tidak berbayar)
        if: ${{ inputs.voice == 'natural' || inputs.voice == 'manusia' || inputs.voice == 'pocket' }}
        continue-on-error: true
        run: |
          # Gunakan CPU-only PyTorch agar tidak mengunduh paket CUDA yang tidak diperlukan.
          python -m pip install --upgrade --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "pocket-tts==3.1.0"

      - name: Cache model Pocket TTS Indonesia
        if: ${{ inputs.voice == 'natural' || inputs.voice == 'manusia' || inputs.voice == 'pocket' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: pocket-id-6l-v35

      - name: Cache model Piper Indonesia
        uses: actions/cache@v4
        with:
          path: Keisha_Video_Cloud_Starter_v1/.piper_models
          key: piper-id-id-news-tts-medium-v1


      - name: Uji program Keisha lama
        working-directory: Keisha_Video_Cloud_Starter_v1
        run: python -m unittest discover -s tests -v

      - name: Produksi desain, suara tegas atau natural beta dan musik latar original
        working-directory: Keisha_Video_Cloud_Starter_v1
        env:
          VIDEO_NASKAH: ${{ inputs.naskah }}
          VIDEO_STYLE: ${{ inputs.style }}
          VIDEO_VOICE: ${{ inputs.voice }}
          VIDEO_MUSIC: ${{ inputs.music }}
          VIDEO_MUSIC_VOLUME: "0.14"
          VIDEO_CTA: ${{ inputs.cta }}
          VIDEO_VISUALS: ${{ inputs.visuals }}
        run: python render_studio.py

      - name: Pastikan MP4 benar-benar memiliki audio jika suara diminta
        working-directory: Keisha_Video_Cloud_Starter_v1
        env:
          VIDEO_VOICE: ${{ inputs.voice }}
        run: |
          python - <<'PYVERIFY'
          import json, pathlib
          p=pathlib.Path('hasil/metadata.json')
          info=json.loads(p.read_text(encoding='utf-8'))
          if (info.get('voice') != 'mati') and not info.get('audio_verified'):
              raise SystemExit('GAGAL: Narasi hilang, MP4 tidak dikirim ke Telegram')
          if info.get('music_enabled') and info.get('music_source')!='original_programmatic_instrumental':
              raise SystemExit('GAGAL: musik bukan dari generator original')
          print('Audio OK:', info.get('voice'), '| musik:', info.get('music_mood'), '| durasi:', info.get('duration'))
          PYVERIFY

      - name: Simpan MP4 dan data produksi
        uses: actions/upload-artifact@v4
        with:
          name: Keisha-MP4-Studio
          path: |
            Keisha_Video_Cloud_Starter_v1/hasil/keisha-rcd-video.mp4
            Keisha_Video_Cloud_Starter_v1/hasil/metadata.json
          if-no-files-found: error
          retention-days: 7

      - name: Kirim hasil ke Telegram
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_KEISHA_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import http.client, json, os, secrets
          from pathlib import Path

          token=os.environ.get('TG_BOT_TOKEN','').strip()
          chat=os.environ.get('TG_CHAT_ID','').strip()
          if not token or not chat:
              print('Telegram belum disetel. Unduh MP4 dari Artifacts.')
              raise SystemExit(0)

          root=Path('Keisha_Video_Cloud_Starter_v1/hasil')
          path=root/'keisha-rcd-video.mp4'
          data=json.loads((root/'metadata.json').read_text(encoding='utf-8'))
          desc={'piper':'Piper tegas (offline gratis)','natural':'Pocket TTS natural beta (offline gratis)','mati':'tanpa suara'}[data['voice']]
          fallback_notice = ('ℹ️ Natural beta belum tersedia, digunakan Piper tegas.\n'
                             if data.get('voice_fallback_reason') else '')
          credit_notice = ('🎤 Model: Pocket TTS Indonesian oleh anak10thn (CC BY 4.0).\n'
                           if data.get('voice') == 'natural' else '')
          caption=(f"🎬 Keisha Studio v3.5 ANTI-SPAM | MP4 berhasil\n"
                   f"Desain per slide: {', '.join(data['scene_styles'])}\n"
                   f"Audio terverifikasi: {'ya' if data['audio_verified'] else 'tidak'} | {desc}\n"
                   f"🎵 Musik original: {data.get('music_mood', 'mati')} | volume di bawah narasi\n"
                   f"Durasi: {data['duration']} detik\n"
                   f"{fallback_notice}"
                   f"{credit_notice}"
                   f"STATUS: DRAF, BELUM DIPOSTING.\n"
                   f"Periksa isi, narasi, dan caption sebelum publikasi.")
          boundary='----Keisha'+secrets.token_hex(12)
          parts=[]
          def field(name,value):
              parts.append((f'--{boundary}\r\nContent-Disposition: form-data; name="{name}"\r\n\r\n{value}\r\n').encode('utf-8'))
          field('chat_id',chat)
          field('caption',caption)
          field('supports_streaming','true')
          parts.append((f'--{boundary}\r\nContent-Disposition: form-data; name="video"; filename="keisha-studio.mp4"\r\nContent-Type: video/mp4\r\n\r\n').encode('utf-8'))
          parts.append(path.read_bytes())
          parts.append(f'\r\n--{boundary}--\r\n'.encode('utf-8'))
          body=b''.join(parts)
          con=http.client.HTTPSConnection('api.telegram.org', timeout=90)
          con.request('POST',f'/bot{token}/sendVideo',body=body,headers={'Content-Type':f'multipart/form-data; boundary={boundary}','Content-Length':str(len(body))})
          r=con.getresponse()
          status=r.status
          answer=json.loads(r.read().decode('utf-8'))
          con.close()
          if status!=200 or not answer.get('ok'):
              raise RuntimeError('Telegram gagal mengirim video; periksa token, ID grup, dan izin bot')
          print('Telegram: MP4 baru terkirim sebagai draf.')
          PY
