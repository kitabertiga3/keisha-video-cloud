
name: Keisha - Buat MP4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buat-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Ambil kode Keisha
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Pasang FFmpeg dan font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Pasang Pillow
        run: python -m pip install -r Keisha_Video_Cloud_Starter_v1/requirements.txt

      - name: Tes program
        working-directory: Keisha_Video_Cloud_Starter_v1
        run: python -m unittest discover -s tests -v

      - name: Buat MP4
        working-directory: Keisha_Video_Cloud_Starter_v1
        run: |
          python - <<'PY'
          from server import DEFAULT_HEADINGS, DEFAULT_BODIES, DEFAULT_CTA
          from video_engine import build_video

          video = build_video(
              'hasil',
              DEFAULT_HEADINGS,
              DEFAULT_BODIES,
              DEFAULT_CTA
          )
          print('MP4 berhasil:', video)
          PY

      - name: Simpan MP4
        uses: actions/upload-artifact@v4
        with:
          name: Keisha-MP4-Ruang-Cuan
          path: Keisha_Video_Cloud_Starter_v1/hasil/keisha-rcd-video.mp4
          if-no-files-found: error
          retention-days: 7
